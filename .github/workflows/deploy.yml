########################################################################################################################
# Fork-local deploy pipeline. Not from upstream.
#
# Builds the jml Navidrome image for linux/amd64 only and pushes it to GHCR. The server
# (lenovo-server) runs a systemd timer that polls this registry and restarts the container
# when the digest changes, so pushing to `main` is the entire deploy gesture.
#
# This deliberately does NOT reuse upstream's pipeline.yml, which cross-compiles every
# supported platform, builds an MSI, and runs the full test/lint matrix. None of that is
# needed to put one image on one server.
#
# The weekly schedule is not housekeeping: yt-dlp is baked into the image and YouTube
# breaks extractors every few weeks, so the rebuild is what keeps the import feature alive.
########################################################################################################################
name: "Deploy: Build and push image to GHCR"

on:
    push:
        branches:
            - main
    schedule:
        # Mondays 03:00 UTC — refreshes yt-dlp inside the image
        - cron: "0 3 * * 1"
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        name: Build and push
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Determine version info
              id: version
              run: |
                  GIT_SHA=$(git rev-parse --short HEAD)
                  GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
                  if [ -n "$GIT_TAG" ]; then
                    GIT_TAG="${GIT_TAG}-jml"
                  else
                    GIT_TAG="0.0.0-jml"
                  fi
                  echo "git_sha=$GIT_SHA" >> "$GITHUB_OUTPUT"
                  echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
                  echo "Building $GIT_TAG ($GIT_SHA)"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: final
                  platforms: linux/amd64
                  push: true
                  provenance: false
                  build-args: |
                      GIT_SHA=${{ steps.version.outputs.git_sha }}
                      GIT_TAG=${{ steps.version.outputs.git_tag }}
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.git_sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Verify runtime dependencies are present in the image
              run: |
                  IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.version.outputs.git_sha }}"
                  docker pull "$IMAGE"
                  echo "--- yt-dlp ---";  docker run --rm --entrypoint yt-dlp  "$IMAGE" --version
                  echo "--- node ---";    docker run --rm --entrypoint node    "$IMAGE" --version
                  echo "--- ffmpeg ---";  docker run --rm --entrypoint ffmpeg  "$IMAGE" -version | head -1
                  echo "--- navidrome ---"; docker run --rm "$IMAGE" --version
